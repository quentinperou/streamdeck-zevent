<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>Cagnotte globale</title>
		<link rel="stylesheet" href="css/pi.css" />
	</head>
	<body>
		<div id="preview" class="preview empty">Chargement…</div>

		<div class="row">
			<label for="label">Intitulé</label>
			<div class="field">
				<input id="label" type="text" placeholder="ZEVENT" maxlength="16" autocomplete="off" />
			</div>
		</div>

		<div class="row">
			<label>Affichage</label>
			<div class="field checks">
				<label class="check"><input id="show-viewers" type="checkbox" checked /> Viewers</label>
			</div>
		</div>

		<div class="row">
			<label for="format">Chiffres</label>
			<div class="field">
				<select id="format">
					<option value="full">Complets — 1 250 000 €</option>
					<option value="short">Abrégés — 1.25M €</option>
				</select>
			</div>
		</div>

		<div class="row">
			<label for="click">Au clic</label>
			<div class="field">
				<select id="click">
					<option value="donation">Ouvrir la page de don</option>
					<option value="site">Ouvrir zevent.fr</option>
				</select>
			</div>
		</div>

		<div class="footer">
			<button id="refresh" type="button">↺ Rafraîchir</button>
			<div id="status" class="status"></div>
		</div>

		<script src="js/sd-pi.js"></script>
		<script>
			(function () {
				"use strict";

				var $ = function (id) {
					return document.getElementById(id);
				};

				var settings = {};
				var lastPayload = null;

				/** Le plugin envoie les deux mises en forme : ici on ne fait que choisir. */
				function short() {
					return settings.numberFormat === "short";
				}

				function save() {
					window.PI.setSettings(settings);
				}

				/** Redessine l'aperçu depuis le dernier catalogue reçu et les réglages courants. */
				function fillPreview() {
					var preview = $("preview");
					var totals = lastPayload && lastPayload.totals;

					if (!totals) {
						preview.className = "preview empty";
						preview.textContent =
							lastPayload && lastPayload.error ? "ZEvent injoignable" : "Chargement…";
						return;
					}

					preview.className = "preview";
					preview.innerHTML = "";

					var info = document.createElement("div");
					info.className = "info";

					var name = document.createElement("div");
					name.className = "name";
					name.textContent = $("label").value.trim() || "ZEVENT";

					var amount = document.createElement("div");
					amount.className = "amount";
					amount.textContent = short() ? totals.donationShort : totals.donationText;

					var meta = document.createElement("div");
					meta.className = "meta";
					meta.appendChild(
						document.createTextNode(
							(short() ? totals.viewersShort : totals.viewersFull) + " viewers",
						),
					);

					info.appendChild(name);
					info.appendChild(amount);
					info.appendChild(meta);
					preview.appendChild(info);
				}

				$("label").addEventListener("input", function () {
					settings.label = $("label").value;
					save();
					fillPreview();
				});

				$("show-viewers").addEventListener("change", function () {
					settings.showViewers = $("show-viewers").checked;
					save();
				});

				$("format").addEventListener("change", function () {
					settings.numberFormat = $("format").value;
					save();
					fillPreview();
				});

				$("click").addEventListener("change", function () {
					settings.clickAction = $("click").value;
					save();
				});

				$("refresh").addEventListener("click", function () {
					$("refresh").disabled = true;
					window.PI.sendToPlugin({ event: "refresh" });
					setTimeout(function () {
						$("refresh").disabled = false;
					}, 3000);
				});

				window.PI.onSettings = function (next) {
					settings = next || {};
					$("label").value = settings.label || "";
					$("show-viewers").checked = settings.showViewers !== false;
					$("format").value = settings.numberFormat === "short" ? "short" : "full";
					$("click").value = settings.clickAction === "site" ? "site" : "donation";
					fillPreview();
					window.PI.sendToPlugin({ event: "getCatalogue" });
				};

				window.PI.on("catalogue", function (payload) {
					lastPayload = payload;
					$("refresh").disabled = false;
					fillPreview();

					var status = $("status");
					if (!payload.totals) {
						status.className = "status";
						status.textContent = "";
						return;
					}

					var live = (payload.streamers || []).filter(function (streamer) {
						return streamer.online;
					}).length;
					status.className = payload.stale ? "status error" : "status";
					status.textContent = live + " streamers en direct";
				});
			})();
		</script>
	</body>
</html>
